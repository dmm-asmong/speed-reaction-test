<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스피드 반응속도 테스트</title>
  <style>
    :root { color-scheme: dark; font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; background: #07111f; color: #f7fbff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 45%, rgba(33,85,139,.22), transparent 42%), #07111f; }
    main { width: min(760px, calc(100% - 32px)); }
    .title { margin: 0 0 22px; color: #d9e9f8; font-size: clamp(1rem,2.3vw,1.25rem); font-weight: 650; letter-spacing: -.02em; text-align: center; }
    .scoreboard { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 12px; }
    .score { padding: 14px 18px; border: 1px solid rgba(148,184,218,.18); border-radius: 14px; background: rgba(12,28,47,.82); box-shadow: inset 0 1px rgba(255,255,255,.03); color: #9eb6cc; font-size: clamp(.84rem,2vw,1rem); text-align: center; }
    .score strong { color: #f5f9ff; font-variant-numeric: tabular-nums; font-weight: 750; }
    #gameBox { position: relative; width: 100%; min-height: clamp(330px,56vh,470px); border: 1px solid rgba(151,206,255,.26); border-radius: 24px; display: grid; place-items: center; padding: 32px; appearance: none; color: #fff; background: #1463b8; box-shadow: 0 28px 80px rgba(0,0,0,.36), inset 0 1px rgba(255,255,255,.15); cursor: pointer; overflow: hidden; transition: background-color 180ms ease, transform 100ms ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #gameBox::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px); background-size: 34px 34px; pointer-events: none; }
    #gameBox:hover { filter: brightness(1.05); }
    #gameBox:active { transform: scale(.992); }
    #gameBox:focus-visible { outline: 4px solid #f7fbff; outline-offset: 5px; }
    #gameBox.waiting { background: #b72f39; }
    #gameBox.ready { background: #0e9b5f; }
    #gameBox.false-start { background: #d24c2f; }
    #gameBox.result { background: #4a3db2; }
    .content { position: relative; z-index: 1; text-align: center; pointer-events: none; }
    #message { display: block; font-size: clamp(2rem,7vw,4.4rem); font-weight: 850; letter-spacing: -.055em; line-height: 1.05; text-wrap: balance; }
    #hint { display: block; min-height: 1.5em; margin-top: 15px; color: rgba(255,255,255,.78); font-size: clamp(.9rem,2vw,1.05rem); line-height: 1.5; }
    .ready #message { animation: pulse 700ms ease-out 1; }
    @keyframes pulse { 0% { transform: scale(.9); opacity: .35; } 55% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
    @media (max-width: 480px) { main { width: min(100% - 20px,760px); } .score { padding: 12px 8px; } #gameBox { min-height: 390px; border-radius: 19px; padding: 22px; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <h1 class="title">스피드 반응속도 테스트</h1>
    <section class="scoreboard" aria-label="반응속도 기록">
      <div class="score">최근 기록: <strong id="recentScore">- ms</strong></div>
      <div class="score">최고 기록: <strong id="bestScore">- ms</strong></div>
    </section>
    <button id="gameBox" type="button" aria-describedby="hint">
      <span class="content"><span id="message">클릭해서 시작</span><span id="hint">초록색으로 바뀌는 순간 클릭하세요</span></span>
    </button>
  </main>
  <script>
    const gameBox=document.querySelector('#gameBox'), message=document.querySelector('#message'), hint=document.querySelector('#hint'), recentScore=document.querySelector('#recentScore'), bestScore=document.querySelector('#bestScore');
    let state='idle', readyAt=0, timerId, best=null;
    try { const savedBest=Number(localStorage.getItem('reactionBest')); if(savedBest>0) best=savedBest; } catch (_) {}
    renderScore(bestScore,best);
    function renderScore(element,value){ element.textContent=value===null?'- ms':`${value} ms`; }
    function show(nextState,mainText,subText){ state=nextState; gameBox.className=nextState==='idle'?'':nextState; message.textContent=mainText; hint.textContent=subText; }
    function startRound(){ show('waiting','기다리세요...','아직 클릭하면 안 됩니다'); const delay=2000+Math.random()*2000; timerId=setTimeout(()=>{ readyAt=performance.now(); show('ready','지금 클릭하세요!','최대한 빠르게 클릭하세요'); },delay); }
    function saveBest(value){ best=best===null?value:Math.min(best,value); renderScore(bestScore,best); try { localStorage.setItem('reactionBest',String(best)); } catch (_) {} }
    gameBox.addEventListener('click',()=>{
      if(state==='waiting'){ clearTimeout(timerId); show('false-start','부정 출발!','클릭해서 다시 도전하세요'); return; }
      if(state==='ready'){ const reactionTime=Math.round(performance.now()-readyAt); renderScore(recentScore,reactionTime); saveBest(reactionTime); show('result',`${reactionTime} ms`,'클릭해서 다시 도전하세요'); return; }
      startRound();
    });
  </script>
</body>
</html>
